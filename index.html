<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیکار | سیستم مدیریت هوشمند</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-pink: #ff00ff;
            --dark-bg: #050505;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-main: 'Vazirmatn', sans-serif;
            --font-accent: 'Orbitron', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #050505 100%);
            color: #fff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid var(--glass-border);
        }

        header h1 {
            margin: 0;
            font-family: var(--font-accent);
            font-size: 3.5rem;
            background: linear-gradient(to right, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.5));
            letter-spacing: 10px;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            padding: 40px 20px;
        }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px;
            width: 45%;
            min-width: 350px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .customer-panel { border-top: 5px solid var(--neon-cyan); }
        .piker-panel { border-top: 5px solid var(--neon-pink); }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 1px;
        }
        .customer-panel h2 { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,255,255,0.3); }
        .piker-panel h2 { color: var(--neon-pink); text-shadow: 0 0 10px rgba(255,0,255,0.3); }

        .form-group { margin-bottom: 25px; position: relative; }
        label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: #aaa;
            margin-right: 5px;
        }
        input, textarea {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            color: #fff;
            font-family: var(--font-main);
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        #map-customer, #map-piker {
            height: 220px;
            border-radius: 20px;
            margin: 15px 0;
            border: 1px solid var(--glass-border);
        }
        #address-box {
            font-size: 0.8rem;
            color: var(--neon-cyan);
            text-align: center;
            padding: 12px;
            background: rgba(0, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px dashed var(--neon-cyan);
        }

        .btn-cyan {
            width: 100%;
            padding: 16px;
            background: var(--neon-cyan);
            border: none;
            border-radius: 15px;
            color: #000;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }

        .order-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-right: 4px solid var(--neon-pink);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .order-card p { margin: 10px 0; font-size: 0.9rem; color: #ddd; }
        .order-card strong { color: var(--neon-cyan); }

        .status-panel {
            margin-top: 40px;
            padding: 25px;
            background: rgba(0, 255, 255, 0.05);
            border-radius: 25px;
            border: 1px solid var(--neon-cyan);
            display: none;
            text-align: center;
        }
        .status-active { display: block; animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 255, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(0, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 255, 0); }
        }

        .btn-call {
            width: 100%;
            padding: 18px;
            background: #2ecc71;
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 20px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        
        #piker-navigation { display: none; }
        .nav-active { display: block !important; }

        @media (max-width: 850px) { 
            .panel { width: 100%; } 
            header h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<header>
    <h1>PEYKAR</h1>
    <p style="color: #888; letter-spacing: 2px;">NEXT-GEN LOGISTICS</p>
</header>

<div class="main-container">
    
    <!-- پنل مشتری -->
    <div class="panel customer-panel">
        <h2 style="color:var(--neon-cyan)"> سفارش جدید</h2>
        <form id="customerForm">
            <div class="form-group">
                <label>نام و نام خانوادگی</label>
                <input type="text" id="custName" required placeholder="نام خود را وارد کنید...">
            </div>
            <div class="form-group">
                <label>جزئیات کالای ارسالی</label>
                <textarea id="orderText" rows="2" required placeholder="مثلاً: یک عدد نان..."></textarea>
            </div>
            <div class="form-group">
                <label>شماره تماس (برای پیک)</label>
                <input type="tel" id="customerPhone" required placeholder="مثلاً: 09123456789">
            </div>
            <div class="form-group">
                <label>آدرس دقیق شما</label>
                <input type="text" id="exactAddressInput" placeholder="مثلاً: فرشته، خیابان...">
            </div>
            <div class="form-group">
                <label>موقعیت مقصد (روی نقشه)</label>
                <div id="map-customer"></div>
                <div id="address-box">📍 برای ثبت، روی نقشه ضربه بزنید</div>
            </div>
            <button type="submit" class="btn-cyan">ثبت نهایی سفارش</button>
        </form>

        <div id="customerStatusSection" class="status-panel">
            <h3 style="color:var(--neon-cyan); margin:0;">وضعیت فعلی</h3>
            <div id="statusContent" style="margin-top:10px;"></div>
        </div>
    </div>

    <!-- پنل پیک -->
    <div class="panel piker-panel">
        <h2 style="color:var(--neon-pink)">داشبورد پیک</h2>
        
        <div id="orders-list-container">
            <p id="no-orders" style="text-align: center; color: #555; font-size: 0.9rem;">در انتظار سفارش جدید...</p>
            <div id="orders-list"></div>
        </div>

        <!-- پنل ناوبری فعال پیک -->
        <div id="piker-navigation">
            <div id="active-order-info" style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 20px; margin-bottom: 15px;"></div>
            <div id="map-piker"></div>
            <a id="call-link" href="#" class="btn-call">📞 تماس با مشتری</a>
            <button onclick="finishJob()" style="width:100%; padding:15px; background:#333; border:none; color:#fff; border-radius:15px; margin-top:10px; font-weight:bold;">✅ تکمیل مأموریت</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let orders = [];
    let currentActiveOrderId = null;
    let selectedLatLng = null;
    let selectedMapAddress = "";

    // --- نقشه مشتری ---
    const mapCust = L.map('map-customer').setView([35.6892, 51.3890], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapCust);
    let custMarker = null;

    mapCust.on('click', async function(e) {
        selectedLatLng = e.latlng;
        if (custMarker) mapCust.removeLayer(custMarker);
        custMarker = L.marker(selectedLatLng).addTo(mapCust);
        
        document.getElementById('address-box').innerText = "⏳ در حال دریافت آدرس...";
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${e.latlng.lat}&lon=${e.latlng.lng}&accept-language=fa`);
            const data = await res.json();
            let displayName = data.display_name.split(',');
            selectedMapAddress = `${displayName[0] || ''}, ${displayName[1] || ''}, ${displayName[2] || ''}`.replace(/^, |,$|, ,/g, '').trim();
            document.getElementById('address-box').innerText = "📍 " + selectedMapAddress;
        } catch (err) {
            document.getElementById('address-box').innerText = "خطا در دریافت آدرس";
        }
    });

    // --- نقشه پیک ---
    const mapPiker = L.map('map-piker').setView([35.6892, 51.3890], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapPiker);
    let pikerMarker = null;

    // --- ثبت سفارش ---
    document.getElementById('customerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        if (!selectedLatLng) { alert("لطفاً مقصد را روی نقشه مشخص کنید!"); return; }

        const order = {
            id: Date.now(),
            customerName: document.getElementById('custName').value,
            orderDetail: document.getElementById('orderText').value,
            customerPhone: document.getElementById('customerPhone').value,
            exactAddress: document.getElementById('exactAddressInput').value, // آدرس تایپ شده
            mapAddress: selectedMapAddress, // آدرس از نقشه
            lat: selectedLatLng.lat,
            lng: selectedLatLng.lng,
            time: new Date().toLocaleString('fa-IR'),
            status: 'waiting'
        };

        orders.push(order);
        this.reset();
        selectedLatLng = null;
        if(custMarker) mapCust.removeLayer(custMarker);
        document.getElementById('address-box').innerText = "📍 برای ثبت، روی نقشه ضربه بزنید";
        
        alert("✅ سفارش شما با موفقیت ثبت شد!");
        updateCustomerStatusPanel();
        renderPikerOrders();
    });

    function renderPikerOrders() {
        const listDiv = document.getElementById('orders-list');
        const waitingOrders = orders.filter(o => o.status === 'waiting');
        const noOrdersMsg = document.getElementById('no-orders');

        listDiv.innerHTML = '';
        if (waitingOrders.length === 0) {
            noOrdersMsg.style.display = 'block';
        } else {
            noOrdersMsg.style.display = 'none';
            waitingOrders.forEach(order => {
                const card = document.createElement('div');
                card.className = 'order-card';
                card.innerHTML = `
                    <p><strong style="color:var(--neon-pink)">👤 مشتری:</strong> ${order.customerName}</p>
                    <p><strong style="color:var(--neon-cyan)">📦 سفارش:</strong> ${order.orderDetail}</p>
                    <button class="btn-pink" onclick="acceptOrder(${order.id})" style="width:100%; padding:10px; background:var(--neon-pink); border:none; border-radius:10px; color:white; font-weight:bold; cursor:pointer;">پذیرش فوری</button>
                `;
                listDiv.appendChild(card);
            });
        }
    }

    window.acceptOrder = function(id) {
        const orderIndex = orders.findIndex(o => o.id === id);
        if (orderIndex !== -1) {
            orders[orderIndex].status = 'accepted';
            currentActiveOrderId = id;
            renderPikerOrders();
            showActiveOrderForPiker(orders[orderIndex]);
            updateCustomerStatusPanel();
        }
    };

    function showActiveOrderForPiker(order) {
        document.getElementById('orders-list-container').style.display = 'none';
        const nav = document.getElementById('piker-navigation');
        nav.style.display = 'block';
        nav.classList.add('nav-active');
        
        document.getElementById('active-order-info').innerHTML = `
            <div style="border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 10px;">
                <p style="margin:0; color:var(--neon-cyan); font-weight:bold;">📋 جزئیات مأموریت</p>
            </div>
            <p><strong style="color:var(--neon-pink)">👤 مشتری:</strong> ${order.customerName}</p>
            <p><strong style="color:var(--neon-pink)">📞 تماس:</strong> <span style="color:var(--neon-cyan);">${order.customerPhone}</span></p>
            <p><strong style="color:var(--neon-pink)">📝 آدرس تایپ شده:</strong> <br><small>${order.exactAddress || 'ثبت نشده'}</small></p>
            <p><strong style="color:var(--neon-pink)">📍 آدرس روی نقشه:</strong> <br><small>${order.mapAddress}</small></p>
            <p><strong style="color:var(--neon-pink)">📦 کالا:</strong> ${order.orderDetail}</p>
        `;

        document.getElementById('call-link').href = `tel:${order.customerPhone}`;
        
        mapPiker.setView([order.lat, order.lng], 15);
        if (pikerMarker) mapPiker.removeLayer(pikerMarker);
        pikerMarker = L.marker([order.lat, order.lng]).addTo(mapPiker);
    };

    window.finishJob = function() {
        alert("🎉 مأموریت با موفقیت به پایان رسید!");
        const order = orders.find(o => o.id === currentActiveOrderId);
        if (order) order.status = 'completed';
        currentActiveOrderId = null;
        document.getElementById('orders-list-container').style.display = 'block';
        document.getElementById('piker-navigation').style.display = 'none';
        renderPikerOrders();
        updateCustomerStatusPanel();
    };

    function updateCustomerStatusPanel() {
        const section = document.getElementById('customerStatusSection');
        const content = document.getElementById('statusContent');
        const lastOrder = orders.length > 0 ? orders[orders.length - 1] : null;

        if (lastOrder) {
            section.classList.add('status-active');
            section.style.display = 'block';
            let text = "", color = "";

            if (lastOrder.status === 'waiting') { text = "⏳ در انتظار پذیرش..."; color = "var(--neon-cyan)"; }
            else if (lastOrder.status === 'accepted') { text = "🚀 پیک در راه است!"; color = "var(--neon-pink)"; }
            else { text = "✅ تحویل شد."; color = "#2ecc71"; }

            content.innerHTML = `<p style="font-weight:bold; color:${color};">${text}</p>`;
        } else {
            section.style.display = 'none';
        }
    }
</script>
</body>
</html>
